name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install
        # argostranslate pulls torch in through stanza. The default Linux wheel
        # drags in several GB of CUDA libraries the suite never touches, so take
        # the CPU build first and let pip treat torch as already satisfied.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: black
        run: black --check .
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy echotranslate
      - name: pytest
        run: pytest -q
      - name: voice extra resolves
        # The heavy models can't run here, but a broken pin in the voice extra
        # should still fail the build rather than a user's first install.
        run: pip install --dry-run -q ".[voice]"
