[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "echotranslate"
version = "0.1.0"
description = "Hear text spoken in your own cloned voice in another language: a local, offline pronunciation-practice CLI."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "David Burton", email = "david@databurton.com" }]
keywords = ["voice-cloning", "text-to-speech", "translation", "whisper", "xtts", "cli", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Core: the translation engine and terminal UI. This installs and runs without
# the voice-cloning model weights. (Argos pulls PyTorch transitively via stanza,
# so torch comes along here; the ~2 GB XTTS and ~460 MB Whisper *weights* are
# runtime downloads gated behind the `voice` extra and explicit user action.)
dependencies = [
    "rich>=13,<15",
    "argostranslate>=1.10,<2",
    "soundfile>=0.12,<1",
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
# Microphone capture and playback. Needs the PortAudio system library
# (brew install portaudio / apt install libportaudio2).
audio = [
    "sounddevice>=0.4,<0.6",
]
# Full pipeline: voice cloning (Coqui XTTS, community Idiap fork) and live
# speech-to-text (Whisper). Large; downloads model weights on first use.
voice = [
    "echotranslate[audio]",
    "coqui-tts>=0.27,<0.28",
    "faster-whisper>=1.0,<2",
]
dev = [
    "pytest>=8,<9",
    "black==24.10.0",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[project.urls]
Homepage = "https://github.com/Burton-David/echo-translate"
Repository = "https://github.com/Burton-David/echo-translate"
Issues = "https://github.com/Burton-David/echo-translate/issues"

[project.scripts]
echotranslate = "echotranslate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["echotranslate"]

[tool.hatch.build.targets.sdist]
include = ["echotranslate", "tests", "download_whisper.py", "voice_script.txt", "README.md", "LICENSE"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "TTS.*",
    "faster_whisper.*",
    "sounddevice.*",
    "soundfile.*",
    "argostranslate.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-m 'not heavy'"
markers = [
    "heavy: requires XTTS/Whisper models or a real audio device; excluded from the default run",
]
testpaths = ["tests"]
